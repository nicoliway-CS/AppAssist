# Companies worth a Discord ping.
#
# WHY THIS EXISTS
#   Every posting that passes the location/internship/category filters lands
#   on the board regardless of who posted it -- that pool is large. This list
#   is the noise control on top of it: Discord only fires for postings from a
#   company on this list. It is not a signal about sponsorship or eligibility
#   (there is none to track here -- see README), just "companies I actually
#   want pinged for."
#
# THIS LIST IS YOURS
#   Unlike the old h1b_sponsors.yaml it replaces, there is no external data
#   source backing these names -- USCIS H-1B filings say nothing about
#   whether a company is worth your time as a US-citizen intern applicant.
#   Add, remove, and regroup freely. It's seeded with big tech plus the
#   aerospace/defense/robotics names relevant to embedded and hardware work,
#   but the whole point is that you keep it current, not that it's complete.
#
# HOW MATCHING WORKS
#   Names are normalized (lowercased, de-accented, legal suffixes stripped)
#   and matched exactly OR as a prefix, so "Amazon" catches "Amazon Web
#   Services" and "Amazon Robotics" without a separate entry for each.
#   Prefix-anchored rather than substring-anchored, carried over deliberately
#   from the original sponsor list: a contains-match let "Applied Materials"
#   hit "Johns Hopkins Applied Physics Laboratory" during testing there. Keep
#   entries as the SHORTEST distinctive form of the name -- "Capital One", not
#   "Capital One Financial Corporation".
#
# MAINTENANCE
#   Add a company: put it in the group that fits, shortest distinctive name.
#   Delete a whole group you've lost interest in -- the loader flattens
#   whatever groups remain, so removing one changes nothing else.

