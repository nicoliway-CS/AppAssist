# Source repos to watch.
#
# adapter: "simplify_json" | "markdown_table"
#   simplify_json  -> Simplify-style listings.json (list of posting objects)
#   markdown_table -> README with a | Company | Role | Location | Link | Date | table
#
# A failing source is logged and skipped; it never aborts the run.
#
# Both sources below are the CURRENT internship-cycle repos, not the old
# new-grad ones. Verified 2026-09 against the live files before switching:
#
#   SimplifyJobs/Summer2027-Internships -- same listings.json shape as the old
#   New-Grad-Positions repo (company_name, title, locations list, url,
#   sponsorship enum, epoch date_posted, active, is_visible). It also ships a
#   `category` field (Software / Hardware / AI-ML-Data / Product / Quant) that
#   looked tempting as a shortcut, but sampling it turned up "Software
#   Development Intern" and "Embedded Software Engineer Intern" both filed
#   under "Hardware" -- unusable as a filter, same problem the eu-tech-jobs
#   role_family tag had. See config/role_categories.yaml for what's used
#   instead. Despite the "2027" name it's the actively-maintained repo and
#   currently carries Summer 2026 (mostly closed/inactive now), Fall 2026,
#   and Winter/Spring/Summer 2027 postings all together -- require_active
#   below is what keeps the closed Summer 2026 backlog out.
#
#   vanshb03/Summer2027-Internships -- same | Company | Role | Location |
#   Application/Link | Date Posted | table shape as the old New-Grad-2026
#   repo (that repo has since been renamed New-Grad-2027 upstream; not used
#   here). One thing flipped between the two eras of this table: 🛂 used to
#   mean "sponsors internationals" and here it means "does NOT offer
#   sponsorship" per this repo's own legend. Harmless for this bot --
#   sponsorship_flag isn't read anywhere in the internship-board pipeline --
#   but don't resurrect a sponsorship feature against this field without
#   re-checking the legend.

sources:
  - name: SimplifyJobs/Summer2027-Internships
    adapter: simplify_json
    url: https://raw.githubusercontent.com/SimplifyJobs/Summer2027-Internships/dev/.github/scripts/listings.json

  - name: vanshb03/Summer2027-Internships
    adapter: markdown_table
    url: https://raw.githubusercontent.com/vanshb03/Summer2027-Internships/main/README.md

settings:
  # Only consider postings still marked active/open by the source.
  require_active: true

  # Primary enforcement of "internship only" is the source swap above -- both
  # repos are internship/co-op boards by scope. This is the fallback safety
  # net for the rows that leak through anyway (a company cross-posting its
  # new-grad req into an internship board, an off-cycle "Early Career
  # Program" row, etc.). Matched whole-word/phrase against the normalized
  # title; a title matching none of these is dropped even though it came
  # from an internship-scoped source.
  require_internship_title_patterns:
    - intern
    - interns
    - internship
    - internships
    - co-op
    - coop
    - summer analyst
    - student researcher

  # Titles containing any of these terms are dropped before location/category
  # checks. Deliberately short: with role_categories.yaml now doing the "does
  # this look like a CS/CE role" work as a positive screen, most of the old
  # non-CS blocklist (retail, back-office, the EU source's French/German/
  # Italian/Spanish terms) is dead weight now that source is gone -- a title
  # that doesn't look like software/embedded/hardware engineering is dropped
  # by the category screen without needing to be named here first.
  #
  # What's left is either genuinely global (sales/recruiting/legal titles that
  # could theoretically contain a category keyword) or a specific trap found
  # while tuning:
  #   "sales engineer" / "solutions engineer" -- pre-sales technical roles.
  #   Would otherwise ride into Software or Hardware Engineering on the
  #   "engineer" association if those categories are ever loosened to a bare
  #   "engineer" term (they currently are NOT, on purpose -- see
  #   role_categories.yaml -- so these are a belt-and-suspenders guard, not
  #   load-bearing today).
  #
  # NOTE: clearance/citizenship terms (TS/SCI, polygraph, ITAR, "US citizen
  # required"...) that the old EU/sponsorship-focused config excluded are
  # deliberately NOT here. Those existed to protect international candidates
  # who could never clear them; a US citizen isn't blocked by a title merely
  # announcing a clearance requirement. Cleared defense/aerospace roles are
  # exactly the kind of posting notify_companies.yaml is meant to surface.
  exclude_title_patterns:
    - sales engineer
    - solutions engineer
    - technical account manager
    - account executive
    - business development
    - sales development
    - technician
    - field service
    - recruiter
    - recruiting
    - talent acquisition
    - human resources
    - accountant
    - paralegal
    - attorney
    - payroll
    - brand marketing
    - product marketing
    - social media
    - content marketing

  # Drop seen-ids first observed more than this many days ago.
  prune_after_days: 90

  # Safety cap on how many postings one run may notify about. Only postings
  # from a config/notify_companies.yaml company are candidates for
  # notification at all -- see README -- so this caps that (much smaller)
  # pool, not the full board.
  max_notifications_per_run: 60
